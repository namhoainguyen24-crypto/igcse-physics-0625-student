<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambridge IGCSE Physics (0625) — Candidate Diagnostic Test</title>
  <style>
    :root { --bg:#f1f5f9; --ink:#0f172a; --muted:#475569; --accent:#1d4ed8; --border:#cbd5e1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
    .topbar { background:linear-gradient(135deg,#0f172a,#1e3a8a); color:#fff; padding:14px 20px; }
    .topbar-inner { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; }
    .container { max-width:980px; margin:16px auto 70px; padding:0 16px; }
    .cand-box { background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
    .cand-box label { display:block; font-size:0.78rem; font-weight:700; color:var(--muted); margin-bottom:4px; }
    .cand-box input { width:100%; padding:8px 10px; border:1px solid #94a3b8; border-radius:6px; }
    .sheet { background:#fff; border:1px solid var(--border); border-radius:12px; padding:24px; }
    .section-banner { margin:22px 0 12px; padding:9px 14px; background:#0f172a; color:#fff; border-radius:8px; font-weight:700; display:flex; justify-content:space-between; }
    .q-card { border:1px solid #e2e8f0; border-radius:10px; padding:15px 17px; margin-bottom:14px; }
    .mcq-opts { list-style:none; padding:0; margin:10px 0 0; display:grid; gap:8px; }
    .mcq-opts li { display:flex; gap:8px; border:1px solid #cbd5e1; border-radius:8px; padding:8px 11px; cursor:pointer; background:#f8fafc; }
    .mcq-opts li.picked { border-color:var(--accent); background:#eff6ff; }
    .svg-wrap { margin:10px 0; text-align:center; overflow-x:auto; }
    .subpart { margin-top:12px; padding-top:10px; border-top:1px dashed #cbd5e1; }
    .online-ta { width:100%; min-height:60px; margin-top:6px; padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px; font-family:inherit; }
    .print-ans { display:none; white-space:pre-wrap; border:1px solid #cbd5e1; padding:6px 8px; margin-top:6px; }
    .exam-tbl { width:100%; border-collapse:collapse; margin-top:8px; font-size:0.86rem; }
    .exam-tbl th, .exam-tbl td { border:1px solid #94a3b8; padding:5px 9px; text-align:left; }
    .appendix-page { margin-top:20px; border-top:2px solid #cbd5e1; padding-top:14px; }
    .bar { position:sticky; bottom:10px; margin-top:18px; background:#0f172a; color:#fff; border-radius:12px; padding:13px 18px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; }
    .btn { border:none; border-radius:8px; padding:9px 14px; font-size:0.86rem; font-weight:600; cursor:pointer; color:#fff; background:#2563eb; }
    .btn-green { background:#059669; } .btn-slate { background:#475569; }
    .submit-panel { display:none; margin-top:18px; background:#ecfdf5; border:2px solid #059669; border-radius:12px; padding:16px 18px; }
    .submit-panel.show { display:block; }
    .code-area { width:100%; height:72px; font-family:monospace; font-size:0.78rem; padding:8px; border:1px solid #94a3b8; border-radius:6px; margin-top:8px; }
    @media print {
      .no-print,.topbar,.bar,.submit-panel { display:none !important; }
      .online-ta { display:none !important; }
      .print-ans { display:block !important; }
      .q-card { break-inside:avoid; }
      body { background:#fff; }
    }
  </style>
</head>
<body>
  <div class="topbar no-print">
    <div class="topbar-inner">
      <div>
        <strong style="font-size:1.1rem;">Cambridge IGCSE Physics (0625) — Online Diagnostic Paper</strong>
        <div style="font-size:0.82rem;color:#cbd5e1;" id="topMilestone">Candidate Mode • Auto-saved locally</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-slate" onclick="window.print()">🖨️ In / Lưu PDF</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="cand-box">
      <div><label>Candidate Name *</label><input id="stName" type="text" placeholder="Họ và tên học sinh..." oninput="saveDraft()" /></div>
      <div><label>School / Grade</label><input id="stSchool" type="text" placeholder="Trường đang học..." oninput="saveDraft()" /></div>
      <div><label>Remaining Time</label><input id="timerBox" type="text" readonly value="50:00" style="font-weight:700;background:#f8fafc;" /></div>
    </div>
    <div class="sheet" id="paperSheet"></div>

    <div class="submit-panel no-print" id="submitPanel">
      <h3 style="margin:0 0 6px;color:#065f46;">✅ Đã hoàn tất &amp; khóa bài làm!</h3>
      <p style="margin:0 0 10px;font-size:0.9rem;">Gửi file hoặc Mã bài nộp bên dưới cho giáo viên chấm:</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <button class="btn btn-green" onclick="downloadSub()">💾 Tải file bài làm (.json)</button>
        <button class="btn" onclick="copySubCode()">📋 Copy Mã bài nộp</button>
        <button class="btn btn-slate" onclick="window.print()">🖨️ In / PDF bài làm</button>
      </div>
      <textarea id="subCodeOut" class="code-area" readonly></textarea>
    </div>

    <div class="bar no-print">
      <div id="progText" style="font-weight:700;">Answered: 0 MCQs</div>
      <button class="btn btn-green" id="btnSubmit" onclick="submitTest()">🚀 Nộp bài &amp; Tạo Mã gửi Giáo viên</button>
    </div>
  </div>

    atp: {
      stem: "You are asked to plan an investigation on how insulation thickness (number of cotton wool layers) affects the cooling rate of hot water. State ONE independent, ONE dependent, and TWO control variables.",
      marks: 2,
      lines: 3,
    }
  }
];
const CONSTANTS_DATA = [
  ["Acceleration of free fall near Earth's surface", "g", "9.8 m/s² (or 9.8 N/kg) — ALWAYS use 9.8, NOT 10"],
  ["Speed of electromagnetic waves in vacuum", "c", "3.0 × 10⁸ m/s"],
  ["Hubble constant", "H₀", "2.2 × 10⁻¹⁸ s⁻¹"],
  ["One light-year", "ly", "9.5 × 10¹⁵ m"],
  ["Absolute zero / Kelvin conversion", "T / K", "T / K = θ / °C + 273 (0 °C = 273 K)"],
  ["Specific heat capacity of water (typical)", "c", "4200 J/(kg °C)"]
];
const PREFIXES_DATA = [
  ["Giga", "G", "10⁹", "1 GW = 10⁹ W"],
  ["Mega", "M", "10⁶", "1 MHz = 10⁶ Hz"],
  ["kilo", "k", "10³", "1 kΩ = 1000 Ω; 1 kJ = 1000 J"],
  ["centi", "c", "10⁻²", "100 cm = 1 m (10⁶ cm³ = 1 m³!)"],
  ["milli", "m", "10⁻³", "1 mA = 0.001 A; 1 ms = 10⁻³ s"],
  ["micro", "μ", "10⁻⁶", "1 μm = 10⁻⁶ m"],
  ["nano", "n", "10⁻⁹", "1 nm = 10⁻⁹ m"]
];
const SYMBOLS_DATA = [
  { name: "Cell", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="8" y1="20" x2="34" y2="20" stroke="#0f172a" stroke-width="2"/><line x1="34" y1="6" x2="34" y2="34" stroke="#0f172a" stroke-width="2"/><line x1="44" y1="12" x2="44" y2="28" stroke="#0f172a" stroke-width="3.5"/><line x1="44" y1="20" x2="72" y2="20" stroke="#0f172a" stroke-width="2"/></svg>` },
  { name: "Fixed resistor", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="20" y2="20" stroke="#0f172a" stroke-width="2"/><rect x="20" y="12" width="40" height="16" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="60" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/></svg>` },
  { name: "Variable resistor", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="20" y2="20" stroke="#0f172a" stroke-width="2"/><rect x="20" y="12" width="40" height="16" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="60" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/><line x1="22" y1="34" x2="58" y2="6" stroke="#0f172a" stroke-width="1.8"/><polygon points="60,4 52,7 57,12" fill="#0f172a"/></svg>` },
  { name: "Thermistor (NTC)", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="20" y2="20" stroke="#0f172a" stroke-width="2"/><rect x="20" y="12" width="40" height="16" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="60" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/><polyline points="18,34 26,34 56,6" fill="none" stroke="#0f172a" stroke-width="1.8"/></svg>` },
  { name: "LDR", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="20" y2="20" stroke="#0f172a" stroke-width="2"/><rect x="20" y="12" width="40" height="16" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="60" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/><circle cx="40" cy="20" r="14" fill="none" stroke="#0f172a" stroke-width="1.4"/><line x1="12" y1="4" x2="22" y2="11" stroke="#0f172a" stroke-width="1.6"/><polygon points="24,12 18,11 21,7" fill="#0f172a"/></svg>` },
  { name: "Lamp", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="26" y2="20" stroke="#0f172a" stroke-width="2"/><circle cx="40" cy="20" r="14" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="30" y1="10" x2="50" y2="30" stroke="#0f172a" stroke-width="1.8"/><line x1="50" y1="10" x2="30" y2="30" stroke="#0f172a" stroke-width="1.8"/><line x1="54" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/></svg>` },
  { name: "Fuse", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/><rect x="22" y="13" width="36" height="14" fill="none" stroke="#0f172a" stroke-width="2"/></svg>` },
  { name: "Diode", svg: `<svg viewBox="0 0 80 40" width="76"><line x1="6" y1="20" x2="74" y2="20" stroke="#0f172a" stroke-width="2"/><polygon points="30,10 30,30 50,20" fill="none" stroke="#0f172a" stroke-width="2"/><line x1="50" y1="10" x2="50" y2="30" stroke="#0f172a" stroke-width="2.2"/></svg>` }
];

const p = new URLSearchParams(location.search);
const mods = (p.get("mods") || "1,2,3,4,12").split(",").map(Number).filter(n => n>=1 && n<=12);
const tier = ["dual","core","ext"].includes(p.get("tier")) ? p.get("tier") : "dual";
const milestone = p.get("milestone") || "Cambridge IGCSE Physics (0625) Diagnostic";
const showConst = p.get("const") !== "0";
const showSym = p.get("sym") !== "0";
const mins = Math.max(10, parseInt(p.get("time") || String(mods.length * 10), 10) || 50);

document.getElementById("topMilestone").textContent = milestone + " • Auto-saved locally";
const STORE_KEY = "igcse_0625_custom_st_" + mods.join("_") + "_" + tier;
let draft = { name:"", school:"", answers:{}, submitted:false };
let secsLeft = mins * 60;

setInterval(() => {
  if (!draft.submitted && secsLeft > 0) {
    secsLeft--;
    document.getElementById("timerBox").value = String(Math.floor(secsLeft/60)).padStart(2,"0") + ":" + String(secsLeft%60).padStart(2,"0");
  }
}, 1000);

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function loadDraft() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) draft = JSON.parse(r); } catch {}
  document.getElementById("stName").value = draft.name || "";
  document.getElementById("stSchool").value = draft.school || "";
}
function saveDraft() {
  draft.name = document.getElementById("stName").value;
  draft.school = document.getElementById("stSchool").value;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(draft)); } catch {}
}

function renderPaper() {
  const chosen = MODULES.filter(m => mods.includes(m.id));
  const dis = draft.submitted ? "disabled" : "";
  const letters = ["A","B","C","D"];
  let qNo = 1;
  const mcqs = [];
  chosen.forEach(m => {
    if (tier !== "ext") mcqs.push({ mod:m, tier:"Core", item:m.mcqCore });
    if (tier !== "core") mcqs.push({ mod:m, tier:"Ext", item:m.mcqExt });
  });
  let h = `<h2 style="margin:0 0 4px;">${esc(milestone)}</h2>
    <p style="margin:0 0 12px;color:#475569;font-size:0.9rem;">Take <strong>g = 9.8 N/kg</strong>. Show full working and units.</p>`;
  h += `<div class="section-banner"><span>SECTION A — Multiple Choice</span><span>${mcqs.length} marks</span></div>`;
  mcqs.forEach(e => {
    const k = `mcq_${e.mod.id}_${e.tier}`;
    const picked = draft.answers[k];
    h += `<div class="q-card"><div><strong>${qNo}.</strong> ${e.item.stem} <strong>[1]</strong></div>
      <ul class="mcq-opts">` + e.item.options.map((op, i) => `
        <li class="${picked===i?'picked':''}" onclick="pickMcq('${k}',${i})">
          <input type="radio" name="${k}" ${picked===i?'checked':''} ${dis} />
          <span><strong>${letters[i]}.</strong> ${op}</span>
        </li>`).join("") + `</ul></div>`;
    qNo++;
  });

  const theories = [];
  chosen.forEach(m => {
    if (tier !== "ext") theories.push({ mod:m, tier:"Core", item:m.theoryCore });
    if (tier !== "core") theories.push({ mod:m, tier:"Ext", item:m.theoryExt });
  });
  h += `<div class="section-banner"><span>SECTION B — Structured Theory</span><span>${theories.length * 3} marks</span></div>`;
  theories.forEach(e => {
    h += `<div class="q-card"><div><strong>Question ${qNo}</strong> [3 marks]</div>
      <div style="margin-top:6px;">${e.item.stem}</div>
      ${e.item.svg ? `<div class="svg-wrap">${SVGS[e.item.svg]}</div>` : ""}
      ` + e.item.parts.map((pt, idx) => {
        const k = `th_${e.mod.id}_${e.tier}_${idx}`;
        const val = draft.answers[k] || "";
        return `<div class="subpart"><div><strong>${pt.lbl}</strong> ${pt.text} <strong>[${pt.marks}]</strong></div>
          <textarea class="online-ta" ${dis} placeholder="Working &amp; answer..." oninput="setTxt('${k}',this.value)">${esc(val)}</textarea>
          <div class="print-ans">${esc(val || "(No answer)")}</div></div>`;
      }).join("") + `</div>`;
    qNo++;
  });

  h += `<div class="section-banner"><span>SECTION C — Practical Skills (ATP)</span><span>${chosen.length * 2} marks</span></div>`;
  chosen.forEach(m => {
    const k = `atp_${m.id}`;
    const val = draft.answers[k] || "";
    h += `<div class="q-card"><div><strong>Question ${qNo}</strong> [2 marks]</div>
      <div style="margin-top:6px;">${m.atp.stem}</div>
      <textarea class="online-ta" ${dis} placeholder="Experimental answer..." oninput="setTxt('${k}',this.value)">${esc(val)}</textarea>
      <div class="print-ans">${esc(val || "(No answer)")}</div></div>`;
    qNo++;
  });

  if (showConst) {
    h += `<div class="appendix-page"><h3>Physical Constants &amp; SI Prefixes</h3>
      <table class="exam-tbl"><tr><th>Quantity</th><th>Symbol</th><th>Value</th></tr>` +
      CONSTANTS_DATA.map(r => `<tr><td>${r[0]}</td><td><strong>${r[1]}</strong></td><td>${r[2]}</td></tr>`).join("") + `</table></div>`;
  }
  if (showSym) {
    h += `<div class="appendix-page"><h3>Standard Circuit Symbols</h3>
      <table class="exam-tbl">` + SYMBOLS_DATA.map(s => `<tr><td>${s.name}</td><td>${s.svg}</td></tr>`).join("") + `</table></div>`;
  }

  document.getElementById("paperSheet").innerHTML = h;
  const doneMcq = mcqs.filter(e => draft.answers[`mcq_${e.mod.id}_${e.tier}`] !== undefined).length;
  document.getElementById("progText").textContent = `MCQ answered: ${doneMcq} / ${mcqs.length}`;
  if (draft.submitted) showSubUI();
}

function pickMcq(k, i) { if (draft.submitted) return; draft.answers[k] = i; saveDraft(); renderPaper(); }
function setTxt(k, v) { if (draft.submitted) return; draft.answers[k] = v; saveDraft(); }
function payload() { return { pack:"0625-custom-v2", mods, tier, milestone, name:draft.name||"Unnamed", school:draft.school||"", submittedAt:new Date().toISOString(), answers:draft.answers }; }
function showSubUI() {
  document.getElementById("btnSubmit").disabled = true;
  document.getElementById("btnSubmit").textContent = "✓ Đã nộp bài";
  document.getElementById("stName").disabled = true;
  document.getElementById("stSchool").disabled = true;
  document.getElementById("subCodeOut").value = btoa(unescape(encodeURIComponent(JSON.stringify(payload()))));
  document.getElementById("submitPanel").classList.add("show");
}
function submitTest() {
  if (!document.getElementById("stName").value.trim()) { alert("Vui lòng nhập Họ tên trước khi nộp."); return; }
  draft.submitted = true; saveDraft(); renderPaper();
  document.getElementById("submitPanel").scrollIntoView({behavior:"smooth"});
}
function downloadSub() {
  const p = payload();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(p,null,2)], {type:"application/json"}));
  a.download = `0625_Custom_${(p.name||"student").replace(/\s+/g,"_")}.json`;
  a.click();
}
function copySubCode() {
  navigator.clipboard?.writeText(document.getElementById("subCodeOut").value).then(() => alert("Đã copy Mã bài nộp!"));
}

loadDraft();
renderPaper();
</script>
</body>
</html>
